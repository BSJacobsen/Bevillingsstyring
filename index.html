<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BevillingsStyring (Live Sync)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs (Compat-udgaver for enkelhed) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Solid Orange Topbjælke -->
  <header class="bg-orange-600 text-white shadow-md relative z-10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      
      <div class="flex items-center space-x-3">
        <!-- Logo med upload-funktion -->
        <div class="relative group cursor-pointer" title="Klik for at skifte logo" onclick="document.getElementById('logoFileInput').click()">
          <div id="logoContainer" class="w-12 h-12 rounded-lg bg-white flex items-center justify-center text-orange-600 font-bold overflow-hidden shadow-sm border border-orange-400">
            <i id="defaultLogoIcon" class="fa-solid fa-hand-holding-dollar text-2xl text-orange-600"></i>
            <img id="customLogoImg" class="hidden w-full h-full object-cover" alt="Logo">
          </div>
          <div class="absolute inset-0 bg-black/40 rounded-lg flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
            <i class="fa-solid fa-camera text-white text-xs"></i>
          </div>
        </div>
        <input type="file" id="logoFileInput" class="hidden" accept="image/*" onchange="handleLogoUpload(event)">

        <!-- Redigerbare Titler -->
        <div>
          <h1 id="appTitle" contenteditable="true" oninput="saveHeaderTexts()" onblur="saveHeaderTexts()" class="text-xl font-bold tracking-tight outline-none hover:bg-orange-700/50 px-1 rounded transition-colors" title="Klik for at redigere">BevillingsStyring </h1>
          <div class="flex items-center gap-2">
            <p id="appSubtitle" contenteditable="true" oninput="saveHeaderTexts()" onblur="saveHeaderTexts()" class="text-xs text-orange-100 outline-none hover:bg-orange-700/50 px-1 rounded transition-colors" title="Klik for at redigere">Administration af fondsmidler og projekter</p>
            <span id="saveStatus" class="text-[10px] bg-orange-700 text-orange-100 px-2 py-0.5 rounded-full italic">Forbinder...</span>
          </div>
        </div>
      </div>

      <!-- Action-knapper i header -->
      <div class="flex items-center space-x-2">
        <button onclick="exportCSV()" class="px-3 py-1.5 bg-orange-700 hover:bg-orange-800 text-white rounded text-xs font-medium transition-colors flex items-center space-x-1.5 border border-orange-500 shadow-sm">
          <i class="fa-solid fa-file-csv"></i>
          <span>Eksport CSV</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Hovedindhold -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Formularkolonne (Venstre) -->
    <div class="lg:col-span-1">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 sticky top-6">
        <div class="flex justify-between items-center mb-4">
          <h2 id="formTitle" class="text-base font-bold text-slate-800 flex items-center gap-2">
            <i id="formIcon" class="fa-solid fa-plus-circle text-orange-600"></i>
            <span id="formTitleText">Ny Bevilling</span>
          </h2>
          <button id="cancelEditBtn" onclick="resetForm()" class="hidden text-xs text-slate-500 hover:text-slate-700 underline">
            Annuller
          </button>
        </div>

        <form id="grantForm" onsubmit="handleFormSubmit(event)" class="space-y-3.5">
          <input type="hidden" id="editingId" value="">
          <input type="hidden" id="createdDate" value="">

          <div class="grid grid-cols-3 gap-3">
            <div class="col-span-1">
              <label class="block text-xs font-semibold text-slate-600 mb-1">Projekt nr.</label>
              <input type="text" id="projectNumber" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:ring-2 focus:ring-orange-500 outline-none" placeholder="2026-001">
            </div>
            <div class="col-span-2">
              <label class="block text-xs font-semibold text-slate-600 mb-1">Projektnavn *</label>
              <input type="text" id="projectName" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none" placeholder="f.eks. Børnehaveindsats">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Fondsgiver *</label>
            <input type="text" id="funder" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none" placeholder="f.eks. Nordea-fonden">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Bevilget Beløb (DKK)</label>
              <input type="number" id="amount" min="0" step="1" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none" placeholder="0">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Bevillingsdato</label>
              <input type="date" id="grantDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Brugsperiode Start</label>
              <input type="date" id="startDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Brugsperiode Slut</label>
              <input type="date" id="endDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Kontaktperson hos fondsgiver/ Ansvarlig hos SIF</label>
            <input type="text" id="contact" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none" placeholder=" ">
          </div>

          <!-- NYT FELT: Link til dokumenter -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Link til Mappe med dokumenter i OneDrive/SharePoint</label>
            <input type="url" id="docLink" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none" placeholder="https://...kopier link fra OndDrive eller SharePoint">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Noter & Betingelser</label>
            <textarea id="notes" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none" placeholder="Særlige krav, regnskabsfrister m.m."></textarea>
          </div>

          <button type="submit" id="submitBtn" class="w-full py-2.5 bg-orange-600 hover:bg-orange-700 text-white font-semibold text-sm rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-floppy-disk"></i>
            <span>Gem Bevilling</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Oversigt og Nøgletal (Højre) -->
    <div class="lg:col-span-2 space-y-5">
      
      <!-- KPI Nøgletal Cards -->
      <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-[10px] font-semibold uppercase text-slate-400">Total Bevilget</p>
          <p id="statTotal" class="text-base font-bold text-slate-900 mt-1">0 kr.</p>
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-[10px] font-semibold uppercase text-slate-400">Aktive</p>
          <p id="statActive" class="text-base font-bold text-emerald-600 mt-1">0</p>
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-[10px] font-semibold uppercase text-rose-500">Udløber snart</p>
          <p id="statExpiringSoon" class="text-base font-bold text-rose-600 mt-1">0</p>
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-[10px] font-semibold uppercase text-slate-400">Kommende</p>
          <p id="statUpcoming" class="text-base font-bold text-amber-600 mt-1">0</p>
        </div>
        <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
          <p class="text-[10px] font-semibold uppercase text-slate-400">Udløbne</p>
          <p id="statExpired" class="text-base font-bold text-slate-500 mt-1">0</p>
        </div>
      </div>

      <!-- Søgning og Filtre -->
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-3 items-center justify-between">
        <div class="relative w-full sm:w-64">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="searchInput" oninput="render()" placeholder="Søg projekt, nr. eller fond..." class="w-full pl-8 pr-3 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto">
          <select id="statusFilter" onchange="render()" class="w-full sm:w-auto px-3 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
            <option value="all">Alle statusser</option>
            <option value="active">Aktiv brugsperiode</option>
            <option value="expiring_soon">Udløber snart (<60 dage)</option>
            <option value="upcoming">Kommende</option>
            <option value="expired">Udløbet</option>
          </select>
        </div>
      </div>

      <!-- Liste med Bevillinger -->
      <div id="grantList" class="space-y-3"></div>

      <!-- Tom tilstand -->
      <div id="emptyState" class="hidden bg-white p-10 rounded-xl border border-slate-200 shadow-sm text-center">
        <div class="w-12 h-12 bg-orange-50 text-orange-500 rounded-full flex items-center justify-center mx-auto text-xl mb-2">
          <i class="fa-solid fa-folder-open"></i>
        </div>
        <h3 class="text-sm font-semibold text-slate-700">Ingen bevillinger fundet</h3>
        <p class="text-xs text-slate-500 mt-1">Opret din første bevilling i formularen til venstre.</p>
      </div>

    </div>

  </main>

  <script>
    // -----------------------------------------------------------------
    // 1. INDSÆT DINE FIREBASE OPLYSNINGER HERUNDER
    // -----------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyAlD2Jzaq5qAi4wX8MD1Q5ztHtMFPLncnY",
      authDomain: "bevillingsstyringsapp.firebaseapp.com",
      databaseURL: "https://bevillingsstyringsapp-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "bevillingsstyringsapp",
      storageBucket: "bevillingsstyringsapp.firebasestorage.app",
      messagingSenderId: "426227450386",
      appId: "1:426227450386:web:d1b5425e7659ce795f8ecb"
    };

    // Initialiser Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // Nøgle til at adskille jeres specifikke app-data
    const APP_DATA_REF = db.ref('bevillingsstyring_v2');

    let grants = [];

    // Realtime Lytter: Henter automatisk nye ændringer fra skyen med det samme!
    APP_DATA_REF.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        if (data.grants) {
          grants = Object.values(data.grants);
        } else {
          grants = [];
        }

        if (data.header) {
          if (data.header.title) document.getElementById('appTitle').textContent = data.header.title;
          if (data.header.subtitle) document.getElementById('appSubtitle').textContent = data.header.subtitle;
          if (data.header.logo) {
            const img = document.getElementById('customLogoImg');
            img.src = data.header.logo;
            img.classList.remove('hidden');
            document.getElementById('defaultLogoIcon').classList.add('hidden');
          }
        }
      } else {
        grants = [];
      }
      
      updateSaveStatus("Live forbundet");
      render();
    }, (error) => {
      console.error(error);
      updateSaveStatus("Fejl i forbindelse");
    });

    function saveHeaderTexts() {
      const title = document.getElementById('appTitle').textContent.trim();
      const subtitle = document.getElementById('appSubtitle').textContent.trim();
      const customLogoImg = document.getElementById('customLogoImg');
      const customLogo = customLogoImg ? customLogoImg.src : '';

      APP_DATA_REF.child('header').set({
        title: title,
        subtitle: subtitle,
        logo: (customLogo && !customLogo.endsWith('#') && !customLogo.includes('window.location')) ? customLogo : ''
      });
    }

    function handleLogoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = document.getElementById('customLogoImg');
        img.src = event.target.result;
        img.classList.remove('hidden');
        document.getElementById('defaultLogoIcon').classList.add('hidden');
        saveHeaderTexts();
      };
      reader.readAsDataURL(file);
    }

    function generateProjectNumber() {
      const year = new Date().getFullYear();
      const yearPrefix = `${year}-`;
      let maxNum = 0;

      grants.forEach(g => {
        if (g.projectNumber && g.projectNumber.startsWith(yearPrefix)) {
          const numPart = parseInt(g.projectNumber.replace(yearPrefix, ''), 10);
          if (!isNaN(numPart) && numPart > maxNum) maxNum = numPart;
        }
      });

      const nextNum = String(maxNum + 1).padStart(3, '0');
      return `${year}-${nextNum}`;
    }

    function calculateStatus(startStr, endStr) {
      if (!startStr || !endStr) {
        return { label: 'Ukendt', class: 'bg-slate-100 text-slate-600', key: 'unknown', daysLeft: null };
      }
      
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const [sYear, sMonth, sDay] = startStr.split('-').map(Number);
      const [eYear, eMonth, eDay] = endStr.split('-').map(Number);

      const start = new Date(sYear, sMonth - 1, sDay, 0, 0, 0);
      const end = new Date(eYear, eMonth - 1, eDay, 23, 59, 59);

      if (today < start) {
        return { label: 'Kommende', class: 'bg-amber-100 text-amber-800 border border-amber-200', key: 'upcoming' };
      } else if (today >= start && today <= end) {
        const diffTime = end - today;
        const daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        if (daysLeft <= 60) {
          return { 
            label: `Udløber om ${daysLeft} d.`, 
            class: 'bg-rose-100 text-rose-800 border border-rose-300 font-bold', 
            key: 'active', 
            isExpiringSoon: true, 
            daysLeft 
          };
        }
        return { 
          label: 'Aktiv', 
          class: 'bg-emerald-100 text-emerald-800 border border-emerald-200', 
          key: 'active', 
          isExpiringSoon: false, 
          daysLeft 
        };
      } else {
        return { label: 'Udløbet', class: 'bg-slate-100 text-slate-600 border border-slate-200', key: 'expired' };
      }
    }

    function formatDKK(amount) {
      return new Intl.NumberFormat('da-DK', { style: 'currency', currency: 'DKK', maximumFractionDigits: 0 }).format(amount || 0);
    }

    function formatDate(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      return isNaN(d) ? dateStr : d.toLocaleDateString('da-DK', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function formatDateTime(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      return isNaN(d) ? dateStr : d.toLocaleDateString('da-DK', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const editingId = document.getElementById('editingId').value;
      const now = new Date().toISOString();
      const id = editingId || 'grant_' + Date.now();
      
      const grantData = {
        id: id,
        projectNumber: document.getElementById('projectNumber').value.trim() || generateProjectNumber(),
        projectName: document.getElementById('projectName').value.trim(),
        funder: document.getElementById('funder').value.trim(),
        amount: Number(document.getElementById('amount').value) || 0,
        grantDate: document.getElementById('grantDate').value,
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value,
        contact: document.getElementById('contact').value.trim(),
        docLink: document.getElementById('docLink').value.trim(),
        notes: document.getElementById('notes').value.trim(),
        createdDate: document.getElementById('createdDate').value || now,
        updatedDate: now
      };

      APP_DATA_REF.child('grants').child(id).set(grantData).then(() => {
        resetForm();
      });
    }

    function editGrant(id) {
      const grant = grants.find(g => g.id === id);
      if (!grant) return;

      document.getElementById('editingId').value = grant.id;
      document.getElementById('projectNumber').value = grant.projectNumber || '';
      document.getElementById('projectName').value = grant.projectName || '';
      document.getElementById('funder').value = grant.funder || '';
      document.getElementById('amount').value = grant.amount || '';
      document.getElementById('grantDate').value = grant.grantDate || '';
      document.getElementById('startDate').value = grant.startDate || '';
      document.getElementById('endDate').value = grant.endDate || '';
      document.getElementById('contact').value = grant.contact || '';
      document.getElementById('docLink').value = grant.docLink || '';
      document.getElementById('notes').value = grant.notes || '';
      document.getElementById('createdDate').value = grant.createdDate || '';

      document.getElementById('formTitleText').textContent = 'Rediger Bevilling';
      document.getElementById('cancelEditBtn').classList.remove('hidden');
      document.getElementById('submitBtn').classList.replace('bg-orange-600', 'bg-blue-600');
      document.getElementById('submitBtn').classList.replace('hover:bg-orange-700', 'hover:bg-blue-700');
    }

    function deleteGrant(id) {
      if (confirm('Vil du slette denne bevilling?')) {
        APP_DATA_REF.child('grants').child(id).remove();
      }
    }

    function resetForm() {
      document.getElementById('grantForm').reset();
      document.getElementById('editingId').value = '';
      document.getElementById('createdDate').value = '';
      document.getElementById('projectNumber').value = generateProjectNumber();
      document.getElementById('formTitleText').textContent = 'Ny Bevilling';
      document.getElementById('cancelEditBtn').classList.add('hidden');
      document.getElementById('submitBtn').classList.replace('bg-blue-600', 'bg-orange-600');
      document.getElementById('submitBtn').classList.replace('hover:bg-blue-700', 'hover:bg-orange-700');
    }

    function render() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('statusFilter').value;

      let total = 0, active = 0, expiringSoon = 0, upcoming = 0, expired = 0;

      grants.forEach(g => {
        total += Number(g.amount) || 0;
        const st = calculateStatus(g.startDate, g.endDate);
        if (st.key === 'active') {
          active++;
          if (st.isExpiringSoon) expiringSoon++;
        } else if (st.key === 'upcoming') {
          upcoming++;
        } else if (st.key === 'expired') {
          expired++;
        }
      });

      document.getElementById('statTotal').textContent = formatDKK(total);
      document.getElementById('statActive').textContent = active;
      document.getElementById('statExpiringSoon').textContent = expiringSoon;
      document.getElementById('statUpcoming').textContent = upcoming;
      document.getElementById('statExpired').textContent = expired;

      const filtered = grants.filter(g => {
        const matchesSearch = (g.projectName && g.projectName.toLowerCase().includes(query)) ||
                              (g.projectNumber && g.projectNumber.toLowerCase().includes(query)) ||
                              (g.funder && g.funder.toLowerCase().includes(query)) ||
                              (g.contact && g.contact.toLowerCase().includes(query));
        
        const st = calculateStatus(g.startDate, g.endDate);
        let matchesStatus = true;
        if (statusFilter === 'active') matchesStatus = st.key === 'active';
        else if (statusFilter === 'expiring_soon') matchesStatus = st.key === 'active' && st.isExpiringSoon;
        else if (statusFilter === 'upcoming') matchesStatus = st.key === 'upcoming';
        else if (statusFilter === 'expired') matchesStatus = st.key === 'expired';

        return matchesSearch && matchesStatus;
      });

      const listContainer = document.getElementById('grantList');
      const emptyState = document.getElementById('emptyState');
      listContainer.innerHTML = '';

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        filtered.forEach(g => {
          const st = calculateStatus(g.startDate, g.endDate);
          const card = document.createElement('div');
          card.className = `bg-white p-4 rounded-xl border shadow-sm transition-all ${st.isExpiringSoon ? 'border-rose-300 ring-1 ring-rose-200' : 'border-slate-200 hover:border-orange-200'}`;

          card.innerHTML = `
            <div class="flex justify-between items-start gap-2">
              <div>
                <div class="flex items-center gap-2">
                  <span class="px-2 py-0.5 bg-slate-100 text-slate-600 rounded text-[11px] font-mono font-bold">${escapeHtml(g.projectNumber || 'Uden nr.')}</span>
                  <h3 class="font-bold text-slate-800 text-base">${escapeHtml(g.projectName)}</h3>
                </div>
                <p class="text-xs text-slate-500 mt-1 flex items-center gap-1.5 flex-wrap">
                  <i class="fa-solid fa-building-columns text-slate-400"></i>
                  <span>${escapeHtml(g.funder)}</span>
                  ${g.contact ? `<span class="text-slate-300">•</span> <i class="fa-regular fa-user"></i> ${escapeHtml(g.contact)}` : ''}
                </p>
              </div>
              <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${st.class}">
                ${st.label}
              </span>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-3 pt-3 border-t border-slate-100 text-xs">
              <div>
                <span class="text-slate-400 block text-[10px] uppercase font-medium">Bevilget Beløb</span>
                <span class="font-semibold text-slate-800">${formatDKK(g.amount)}</span>
              </div>
              <div>
                <span class="text-slate-400 block text-[10px] uppercase font-medium">Bevillingsdato</span>
                <span class="text-slate-700">${formatDate(g.grantDate)}</span>
              </div>
              <div class="col-span-2 sm:col-span-1">
                <span class="text-slate-400 block text-[10px] uppercase font-medium">Brugsperiode</span>
                <span class="text-slate-700">${formatDate(g.startDate)} – ${formatDate(g.endDate)}</span>
              </div>
            </div>

            ${g.docLink ? `
              <div class="mt-2 text-xs">
                <a href="${escapeHtml(g.docLink)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-orange-600 hover:text-orange-700 font-medium hover:underline">
                  <i class="fa-solid fa-folder-open text-orange-500"></i>
                  <span>Åbn dokumenter (OneDrive / SharePoint)</span>
                  <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                </a>
              </div>
            ` : ''}

            ${g.notes ? `<p class="mt-2 text-xs text-slate-500 bg-slate-50 p-2 rounded border border-slate-100 italic">${escapeHtml(g.notes)}</p>` : ''}

            <div class="mt-3 flex justify-between items-center pt-2 border-t border-slate-100 text-[10px] text-slate-400">
              <div>
                Oprettet: ${formatDateTime(g.createdDate)} | Ændret: ${formatDateTime(g.updatedDate)}
              </div>
              <div class="flex gap-2">
                <button onclick="editGrant('${g.id}')" class="px-2.5 py-1 text-xs text-slate-600 hover:text-blue-600 hover:bg-blue-50 rounded transition">
                  <i class="fa-solid fa-pen mr-1"></i> Rediger
                </button>
                <button onclick="deleteGrant('${g.id}')" class="px-2.5 py-1 text-xs text-slate-600 hover:text-rose-600 hover:bg-rose-50 rounded transition">
                  <i class="fa-solid fa-trash mr-1"></i> Slet
                </button>
              </div>
            </div>
          `;
          listContainer.appendChild(card);
        });
      }
    }

    function updateSaveStatus(msg) { 
      const el = document.getElementById("saveStatus"); 
      if (el) el.textContent = msg; 
    }

    function exportCSV() {
      if (grants.length === 0) {
        alert('Der er ingen data at eksportere.');
        return;
      }
      const headers = ['Projektnummer', 'Projektnavn', 'Fondsgiver', 'Beløb (DKK)', 'Bevillingsdato', 'Startdato', 'Slutdato', 'Kontaktperson', 'Dokument Link', 'Noter', 'Oprettet Dato', 'Senest Ændret'];
      const rows = grants.map(g => [
        `"${(g.projectNumber||'').replace(/"/g, '""')}"`,
        `"${(g.projectName||'').replace(/"/g, '""')}"`,
        `"${(g.funder||'').replace(/"/g, '""')}"`,
        g.amount || 0,
        g.grantDate || '',
        g.startDate || '',
        g.endDate || '',
        `"${(g.contact||'').replace(/"/g, '""')}"`,
        `"${(g.docLink||'').replace(/"/g, '""')}"`,
        `"${(g.notes||'').replace(/"/g, '""')}"`,
        g.createdDate || '',
        g.updatedDate || ''
      ]);

      const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(';'), ...rows.map(r => r.join(';'))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `bevillingsstyring_eksport_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
  </script>
</body>
